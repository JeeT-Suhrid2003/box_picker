apiVersion: apps/v1
kind: Deployment
metadata:
  name: box-picker
  labels:
    app: box-picker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: box-picker
  template:
    metadata:
      labels:
        app: box-picker
    spec:
      containers:
        - name: box-picker
          image: jeet23/box_picker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: box_picker_project.settings
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: box-picker-secrets
                  key: DJANGO_SECRET_KEY
            - name: DJANGO_DEBUG
              value: "false"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: box-picker-secrets
                  key: GEMINI_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/v1/boxes/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/boxes/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: box-picker
spec:
  selector:
    app: box-picker
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
